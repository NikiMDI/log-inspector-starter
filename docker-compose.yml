name: ${COMPOSE_PROJECT_NAME:-log-inspector-dev}

services:
  test-runner:
    build:
      context: .
      target: test
    profiles: [tools]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loginspector}
      POSTGRES_USER: ${POSTGRES_USER:-loginspector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loginspector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loginspector} -d ${POSTGRES_DB:-loginspector}"]
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    image: log-inspector:${IMAGE_TAG:-local}
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-loginspector}:${POSTGRES_PASSWORD:-loginspector}@postgres:5432/${POSTGRES_DB:-loginspector}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  pgbouncer:
    build: ./infra/pgbouncer
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loginspector}
      POSTGRES_USER: ${POSTGRES_USER:-loginspector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loginspector}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-50}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-5}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-loginspector} -d ${POSTGRES_DB:-loginspector}"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    image: log-inspector:${IMAGE_TAG:-local}
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-loginspector}:${POSTGRES_PASSWORD:-loginspector}@pgbouncer:6432/${POSTGRES_DB:-loginspector}?sslmode=disable
      HTTP_ADDR: :8080
      DIAGNOSTIC_ADDR: :6060
      UPLOAD_DIR: /data/uploads
      WORKERS: ${WORKERS:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_LINE_BYTES: ${MAX_LINE_BYTES:-1048576}
      DB_MAX_OPEN: ${DB_MAX_OPEN:-4}
      DB_MAX_IDLE: ${DB_MAX_IDLE:-2}
      DB_TIMEOUT: 3s
      PROCESSING_DELAY: ${PROCESSING_DELAY:-0s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    environment:
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-20m}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${DIAGNOSTIC_PORT:-6060}:6060"
    depends_on: [app]
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
  uploads:
  nginx_logs:
